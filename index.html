<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Marcador">
<meta name="theme-color" content="#0e0f11">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<title>Marcador</title>
<style>
:root{--bg:#0e0f11;--card:#17191c;--line:#272a2f;--tx:#cfd3d8;--mut:#7b828b;--acc:#8aa4c8;--ok:#7fb08a;--bad:#c88a8a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;touch-action:manipulation}
button:active{filter:brightness(1.35)}
button:disabled{opacity:.35}
.view{min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 24px);max-width:520px;margin:0 auto}
.view[hidden],.modal[hidden]{display:none}

/* contador */
header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px}
h1{margin:0;font-size:22px;font-weight:600;padding:6px 4px;touch-action:manipulation}
.chip{border-radius:999px;padding:8px 14px;font-size:14px;color:var(--mut)}
.chip.on{background:#26344a;border-color:var(--acc);color:var(--tx)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.tname{width:100%;background:transparent;border:0;color:var(--mut);text-align:center;font:inherit;font-size:15px;padding:4px;outline:none}
.score{font-size:68px;font-weight:600;line-height:1.1;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pm{font-size:26px;padding:10px 0;background:#1d2024}
.hist{margin-top:18px}
.hh,.hr{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px;color:var(--mut);text-align:center;align-items:baseline}
.hh{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.hh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hn{text-align:left}
.hr b{color:var(--tx);font-weight:500;font-size:17px}.hr em{font-style:normal;margin-left:8px;font-size:13px}
.hr.neg b{color:var(--bad)}
footer{display:flex;gap:10px;margin-top:18px}
footer button{flex:1}
.danger{color:var(--bad)}

/* asistente */
.panic{position:sticky;top:0;z-index:5;display:block;width:100%;height:54px;text-align:left;font-size:20px;font-weight:600;background:var(--bg);border-radius:12px;border:1px solid var(--line);margin-bottom:10px}
.sec{margin:16px 2px 8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.sec.dim{opacity:.7}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:inline-flex;align-items:center;justify-content:center;background:#1d2024;border:1px solid #3a3f46;border-radius:8px;padding:0 4px;height:32px;font-variant-numeric:tabular-nums}
.tile{--d:6px;gap:0;height:auto;padding:5px 4px;align-items:stretch}
.h{flex:1 1 0;display:flex;align-items:center;justify-content:center;padding:0 4px}
.f{display:grid;grid-template-columns:repeat(3,var(--d));grid-template-rows:repeat(3,var(--d));gap:calc(var(--d)*.28)}
.f i{width:var(--d);height:var(--d);border-radius:50%}
.f i.on{background:#e3e6ea}
.tile b{width:1px;align-self:stretch;background:#4a5058}
.tbtn{--d:clamp(6px,2.3vw,9.5px);height:54px;padding:0 2px;width:100%;min-width:0}
.tbtn .h{padding:0;min-width:0}
.bf{--d:12px;padding:7px;background:#1d2024;border:1px solid #3a3f46;border-radius:9px}
.nf{--d:4.5px;margin:2px auto 5px}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{padding:5px 12px;font-size:12px;margin-top:8px;white-space:nowrap;flex-shrink:0}
.tile.on{background:#2b3a52;border-color:var(--acc)}
.big{width:100%;margin-top:18px;padding:16px;font-size:18px;background:#26344a;border-color:var(--acc)}
.ghost{width:100%;margin-top:10px;background:transparent;color:var(--mut)}
.note{padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--mut)}
.warn{padding:12px;border:1px solid var(--bad);border-radius:12px;color:var(--bad);margin:10px 0}
.row2,.row3,.row4{display:grid;gap:8px}
.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:repeat(3,1fr)}.row4{grid-template-columns:repeat(4,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.board{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.board span,.board em{color:var(--mut);font-size:13px;font-style:normal}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.seat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.seat small{color:var(--mut);font-size:11px;min-height:14px}
.seat.turn{border-color:var(--acc);background:#1b2431}
.turn2{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.tt{font-size:19px;font-weight:600}
.tb{display:flex;gap:8px}
.hot{background:#2a4a35;border-color:var(--ok)}
.rec{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:10px 0 8px}
.rec.best{border-color:var(--acc);background:#1b2431}
.ri{display:flex;flex-direction:column;gap:2px;min-width:0}
.ri small{color:var(--mut)}
.pcell{display:flex;flex-direction:column;align-items:stretch;padding:0;min-width:0;overflow:hidden;background:#1d2024;border:1px solid #3a3f46;border-radius:8px}
.pcell.tap{border-color:#56627a}
.pcell.dim{opacity:.6}
.pcell .tile{--d:clamp(6px,2.3vw,9.5px);border:0;border-radius:0;background:transparent;height:52px;width:100%;padding:0 2px;min-width:0}
.pcell .tile .h{padding:0;min-width:0}
.pp{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #2e3237;font-size:11px;font-variant-numeric:tabular-nums}
.pp b{font-weight:500;color:var(--mut);padding:3px 0;text-align:center;width:auto;background:none}
.pp b.hi{color:var(--tx);font-weight:700}
.pp b.cur{color:var(--acc)}
.leg{display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;color:var(--mut);text-align:center;margin:-2px 0 6px;max-width:25%}
.leg{max-width:none;width:calc((100% - 24px)/4)}
.bigt{--d:8px}
.ri em{font-style:normal;color:var(--acc)}
.ri small{line-height:1.3}
.alts{display:flex;flex-wrap:wrap;gap:8px}
.alt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:10px}
.alt small{color:var(--mut);font-size:12px}
.row5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.row5 .chip{padding:8px 4px}
.nums{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nums>span{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 0;text-align:center;display:flex;flex-direction:column;font-size:15px}
.nums b{color:var(--mut);font-size:12px;font-weight:500}
.endbox{margin-top:12px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.big2{font-size:22px;font-weight:600;margin-bottom:6px}
.sub{color:var(--mut);margin:6px 0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mbox{background:#181b1f;border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:340px}
.mt{font-size:18px;font-weight:600;margin-bottom:6px}
.mx{color:var(--mut);margin-bottom:10px;font-size:17px}
.mbox input{width:100%;font-size:26px;padding:10px;margin:8px 0 4px;background:#0f1113;color:var(--tx);border:1px solid var(--line);border-radius:10px;text-align:center}
.mb{display:flex;gap:8px;margin-top:12px}
.mbtn{flex:1}.mbtn.pri{background:#26344a;border-color:var(--acc)}
</style>
</head>
<body>

<div id="counter" class="view">
  <header>
    <h1 id="title">Marcador</h1>
    <button id="metaBtn" class="chip">Meta <span id="metaVal">100</span></button>
  </header>
  <div class="teams">
    <div class="team">
      <input class="tname" id="n0" maxlength="14" autocomplete="off">
      <div class="score" id="s0">0</div>
      <div class="tbtns"><button class="pm" data-t="0" data-sg="-1">−</button><button class="pm" data-t="0" data-sg="1">+</button></div>
    </div>
    <div class="team">
      <input class="tname" id="n1" maxlength="14" autocomplete="off">
      <div class="score" id="s1">0</div>
      <div class="tbtns"><button class="pm" data-t="1" data-sg="-1">−</button><button class="pm" data-t="1" data-sg="1">+</button></div>
    </div>
  </div>
  <div class="hist" id="hist"></div>
  <footer>
    <button id="undoBtn">Deshacer</button>
    <button id="newBtn" class="danger">Juego nuevo</button>
  </footer>
</div>

<div id="assist" class="view" hidden>
  <button id="panic" class="panic">‹ Marcador</button>
  <div id="aBody"></div>
</div>

<div id="modal" class="modal" hidden></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

//#ENGINE_START
/* ===== Motor de dominó boricua: conteo, lectura de señales y simulación ===== */
const ALL=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)ALL.push([a,b]);
const idOf=t=>t[0]+'-'+t[1];
const byId={},IDX={};ALL.forEach((t,i)=>{byId[idOf(t)]=t;IDX[idOf(t)]=i;});
const TA=ALL.map(t=>t[0]),TB=ALL.map(t=>t[1]),TP=ALL.map(t=>t[0]+t[1]);
const other=(t,v)=>t[0]===v?t[1]:t[0];
const nextSeat=(A,s)=>(s+(A.dir===-1?3:1))%4;
// asiento <-> posición en el orden de juego (0 yo, 1 el que tira después de mí, 2 compañero, 3 el que tira antes de mí)
const s2p=(A,s)=>A.dir===-1?(4-s)%4:s;
const E2N={F:0,L:1,R:2};
// Modelo de "jugador con lógica": pesos de cada criterio (ajustados con simulación)
const W={pip:0.15,dbl:1.0,keep:0.6,nxt:0.8,blk:1.5,part:1.2};
// beta: cuánto confiamos en que los demás juegan con lógica (0 = ignorar señales)
const CFG={beta:1.0,ns:1500,roll:200,endg:8,noise:0.35};

function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function derive(A){
  const st={board:null,playedIds:new Set(),plays:[0,0,0,0],noHas:[new Set(),new Set(),new Set(),new Set()],turn:A.starter,streak:0,over:null,playedPips:0,
    nh:[0,0,0,0],ctx:[],lead:[-1,-1,-1,-1],puts:[0,1,2,3].map(()=>[0,0,0,0,0,0,0]),playedCnt:[0,0,0,0,0,0,0]};
  A.events.forEach((ev,n)=>{
    const p=s2p(A,ev.s);
    if(ev.k==='p'){
      const t=ev.t,ti=IDX[idOf(t)];
      const bl=st.board?st.board.l:-1,br=st.board?st.board.r:-1;
      const forced=A.first&&n===0;           // el 6|6 de la primera mano no es una decisión
      if(p!==0&&!forced)st.ctx.push({p,ti,e:st.board?(E2N[ev.e]||0):0,l:bl,r:br,nh:st.nh.slice(),fut:[]});
      for(const c of st.ctx)if(c.p===p)c.fut.push(ti);
      if(!st.board||ev.e==='F'){
        st.board={l:t[0],r:t[1]};
        if(!forced)st.lead[p]=ti;
      }else if(ev.e==='L'){st.board.l=other(t,st.board.l);st.puts[p][st.board.l]++;}
      else{st.board.r=other(t,st.board.r);st.puts[p][st.board.r]++;}
      st.playedCnt[t[0]]++;if(t[1]!==t[0])st.playedCnt[t[1]]++;
      st.playedIds.add(idOf(t));st.plays[ev.s]++;st.streak=0;st.playedPips+=t[0]+t[1];
      if(st.plays[ev.s]===7&&!st.over)st.over={type:'domino',seat:ev.s};
      st.turn=nextSeat(A,ev.s);
    }else{
      if(st.board){st.noHas[ev.s].add(st.board.l);st.noHas[ev.s].add(st.board.r);st.nh[p]|=(1<<st.board.l)|(1<<st.board.r);}
      st.streak++;
      if(st.streak>=4&&!st.over)st.over={type:'tranque'};
      st.turn=nextSeat(A,ev.s);
    }
  });
  return st;
}

function legalOptions(t,board){
  if(!board)return [{e:'F',l:t[0],r:t[1]}];
  const out=[];
  if(t[0]===board.l||t[1]===board.l)out.push({e:'L',l:other(t,board.l),r:board.r});
  if((t[0]===board.r||t[1]===board.r)&&!(board.l===board.r&&out.length))out.push({e:'R',l:board.l,r:other(t,board.r)});
  return out;
}

// jugadas posibles: arreglo plano [ficha, lado(0 sale,1 izq,2 der), nuevoIzq, nuevoDer, ...]
function movesFor(hand,l,r){
  const out=[];
  if(l<0){for(const ti of hand)out.push(ti,0,TA[ti],TB[ti]);return out;}
  for(const ti of hand){
    const a=TA[ti],b=TB[ti];let didL=false;
    if(a===l||b===l){out.push(ti,1,a===l?b:a,r);didL=true;}
    if((a===r||b===r)&&!(l===r&&didL))out.push(ti,2,l,a===r?b:a);
  }
  return out;
}

// Qué tan buena le parece una jugada a un jugador con lógica que solo ve su mano y los pases
function hScore(p,hand,ti,nl,nr,nh){
  if(hand.length===1)return 1000;
  let keep=0;
  for(const u of hand){if(u===ti)continue;if(TA[u]===nl||TB[u]===nl)keep++;if(nl!==nr&&(TA[u]===nr||TB[u]===nr))keep++;}
  const n=(p+1)&3,pt=(p+2)&3;
  const ln=((nh[n]>>nl)&1)+((nh[n]>>nr)&1);
  const lp=((nh[pt]>>nl)&1)&((nh[pt]>>nr)&1);
  return W.pip*TP[ti]+(TA[ti]===TB[ti]?W.dbl:0)+W.keep*keep+W.nxt*ln*0.5+(ln===2?W.blk:0)-(lp?W.part:0);
}

function pips(h){let s=0;for(const t of h)s+=TP[t];return s;}
// Resultado en puntos para tu pareja (+) o la de ellos (-). winner = posición que dominó, -1 = tranque
function marginEnd(h,winner){
  const tot=pips(h[0])+pips(h[1])+pips(h[2])+pips(h[3]);
  if(winner>=0)return (winner&1)?-tot:tot;
  const t0=pips(h[0])+pips(h[2]),t1=tot-t0;
  return t0<t1?tot:(t1<t0?-tot:0);
}

function playout(h,l,r,turn,nh,rng){
  let streak=0;
  for(let g=0;g<200;g++){
    const hand=h[turn];const mv=movesFor(hand,l,r);
    if(!mv.length){nh[turn]|=(1<<l)|(1<<r);if(++streak>=4)return marginEnd(h,-1);turn=(turn+1)&3;continue;}
    streak=0;let bi=0,bs=-1e9;
    for(let i=0;i<mv.length;i+=4){const s=hScore(turn,hand,mv[i],mv[i+2],mv[i+3],nh)+CFG.noise*rng();if(s>bs){bs=s;bi=i;}}
    hand.splice(hand.indexOf(mv[bi]),1);l=mv[bi+2];r=mv[bi+3];
    if(!hand.length)return marginEnd(h,turn);
    turn=(turn+1)&3;
  }
  return 0;
}

// Cálculo exacto (todas las manos a la vista) para el final de la mano
function solve(h,l,r,turn,streak,alpha,beta){
  const hand=h[turn];const mv=movesFor(hand,l,r);
  if(!mv.length){if(streak>=3)return marginEnd(h,-1);return solve(h,l,r,(turn+1)&3,streak+1,alpha,beta);}
  const max=(turn&1)===0;let best=max?-1e9:1e9;
  for(let i=0;i<mv.length;i+=4){
    const ti=mv[i],k=hand.indexOf(ti);hand.splice(k,1);
    const v=hand.length?solve(h,mv[i+2],mv[i+3],(turn+1)&3,0,alpha,beta):marginEnd(h,turn);
    hand.splice(k,0,ti);
    if(max){if(v>best)best=v;if(v>alpha)alpha=v;}else{if(v<best)best=v;if(v<beta)beta=v;}
    if(alpha>=beta)break;
  }
  return best;
}

// Reparte imaginariamente las fichas que no has visto (respetando pases y cuántas tiene cada uno)
// y le da más peso a los repartos que explican mejor cómo jugó cada quien.
function analyze(A,opt){
  opt=opt||{};
  const st=derive(A);
  const beta=opt.beta!=null?opt.beta:CFG.beta,NS=opt.ns||CFG.ns;
  const mine=new Set(A.hand.map(idOf));
  const pool=[];for(let i=0;i<28;i++){const id=idOf(ALL[i]);if(!mine.has(id)&&!st.playedIds.has(id))pool.push(i);}
  const seatOf=p=>A.dir===-1?(4-p)%4:p;
  const caps=[1,2,3].map(p=>7-st.plays[seatOf(p)]);
  const K=pool.length;
  const res={st,pool,ok:false,probs:{}};
  if(caps.some(c=>c<0)||caps[0]+caps[1]+caps[2]!==K)return res;
  const masks=pool.map(ti=>{let m=0;for(let j=0;j<3;j++){const b=st.nh[j+1];if(!((b>>TA[ti])&1)&&!((b>>TB[ti])&1))m|=1<<j;}return m;});
  const C1=caps[0],C2=caps[1],D1=C1+1,D2=C2+1;
  const ways=new Float64Array((K+1)*D1*D2);const ix=(k,a,b)=>(k*D1+a)*D2+b;
  ways[ix(K,0,0)]=1;
  for(let k=K-1;k>=0;k--){const rem=K-k,m=masks[k];
    for(let a=0;a<=Math.min(C1,rem);a++)for(let b=0;b<=Math.min(C2,rem-a);b++){const c=rem-a-b;let v=0;
      if((m&1)&&a>0)v+=ways[ix(k+1,a-1,b)];if((m&2)&&b>0)v+=ways[ix(k+1,a,b-1)];if((m&4)&&c>0)v+=ways[ix(k+1,a,b)];ways[ix(k,a,b)]=v;}}
  if(!(ways[ix(0,C1,C2)]>0))return res;
  const rng=mulberry(hashStr(JSON.stringify([A.hand,A.events,A.dir,A.starter])));
  const S=new Array(NS),LW=new Float64Array(NS);
  for(let n=0;n<NS;n++){
    const hs=[null,[],[],[]];let a=C1,b=C2;
    for(let k=0;k<K;k++){const rem=K-k,c=rem-a-b,m=masks[k];
      const w1=(m&1)&&a>0?ways[ix(k+1,a-1,b)]:0,w2=(m&2)&&b>0?ways[ix(k+1,a,b-1)]:0,w3=(m&4)&&c>0?ways[ix(k+1,a,b)]:0;
      const x=rng()*(w1+w2+w3);
      if(x<w1){hs[1].push(pool[k]);a--;}else if(x<w1+w2||w3===0){hs[2].push(pool[k]);b--;}else hs[3].push(pool[k]);}
    S[n]=hs;
    if(beta>0){let lw=0;
      for(const c of st.ctx){const hand=hs[c.p].concat(c.fut);const mv=movesFor(hand,c.l,c.r);if(mv.length<=4)continue;
        let mx=-1e9,ch=null;const sc=[];
        for(let i=0;i<mv.length;i+=4){const s=beta*hScore(c.p,hand,mv[i],mv[i+2],mv[i+3],c.nh);sc.push(s);if(s>mx)mx=s;if(mv[i]===c.ti&&(c.l<0||mv[i+1]===c.e))ch=s;}
        if(ch===null)continue;let z=0;for(const s of sc)z+=Math.exp(s-mx);lw+=ch-mx-Math.log(z);}
      LW[n]=lw;}
  }
  let mx=-1e300;for(let n=0;n<NS;n++)if(LW[n]>mx)mx=LW[n];
  const Wt=new Float64Array(NS);let sum=0;for(let n=0;n<NS;n++){Wt[n]=Math.exp(LW[n]-mx);sum+=Wt[n];}
  let s2=0;for(let n=0;n<NS;n++){Wt[n]/=sum;s2+=Wt[n]*Wt[n];}
  // probabilidades por ficha, fichas esperadas por número y puntos esperados de cada mano
  const pr={},E=[null,new Array(7).fill(0),new Array(7).fill(0),new Array(7).fill(0)],EP=[0,0,0,0];
  for(const ti of pool)pr[ti]=[0,0,0,0];
  for(let n=0;n<NS;n++){const w=Wt[n],hs=S[n];
    for(let p=1;p<=3;p++)for(const ti of hs[p]){pr[ti][p]+=w;E[p][TA[ti]]+=w;if(TB[ti]!==TA[ti])E[p][TB[ti]]+=w;EP[p]+=w*TP[ti];}}
  for(const ti of pool){const q=pr[ti];res.probs[idOf(ALL[ti])]=[1,2,3].map(s=>q[s2p(A,s)]);}
  Object.assign(res,{ok:true,S,W:Wt,E,EP,ess:1/s2,total:ways[ix(0,C1,C2)]});
  return res;
}

// Para cada ficha que puedes tirar: simula el resto de la mano en los repartos posibles y promedia los puntos
function recommendMoves(A,an,opt){
  opt=opt||{};const st=an.st;const R=opt.roll||CFG.roll;
  const my=A.hand.map(t=>IDX[idOf(t)]).filter(ti=>!st.playedIds.has(idOf(ALL[ti])));
  const l=st.board?st.board.l:-1,r=st.board?st.board.r:-1;
  const mv=movesFor(my,l,r);
  if(!mv.length||!an.ok)return [];
  const rr=mulberry(777),idxs=[];const step=1/R;let u=rr()*step,c=an.W[0],j=0;
  for(let n=0;n<R;n++){const x=u+n*step;while(x>c&&j<an.W.length-1){j++;c+=an.W[j];}idxs.push(j);}
  const tilesLeft=my.length-1+an.pool.length;
  const out=[];
  for(let i=0;i<mv.length;i+=4){
    const ti=mv[i];const rest=my.filter(x=>x!==ti);const nl=mv[i+2],nr=mv[i+3];
    let sum=0,wins=0,ties=0;const rng=mulberry(12345);
    for(const k of idxs){const s=an.S[k];let v;
      if(!rest.length)v=marginEnd([rest,s[1],s[2],s[3]],0);
      else{const h=[rest.slice(),s[1].slice(),s[2].slice(),s[3].slice()];
        v=tilesLeft<=CFG.endg?solve(h,nl,nr,1,0,-1e9,1e9):playout(h,nl,nr,1,st.nh.slice(),rng);}
      sum+=v;if(v>0)wins++;else if(v===0)ties++;}
    out.push({ti,t:ALL[ti],e:['F','L','R'][mv[i+1]],l:nl,r:nr,ev:sum/idxs.length,win:wins/idxs.length,tie:ties/idxs.length});
  }
  out.sort((a,b)=>b.ev-a.ev);
  return out;
}

// Las dos razones: (1) lo que hace en la mesa, (2) lo que hace por tus fichas
function explain(A,an,rec){
  const st=an.st,ti=rec.ti,a=TA[ti],b=TB[ti],E=an.E;
  const SN=['tú','el rival de la derecha','tu compañero','el rival de la izquierda'];
  const nm=p=>SN[A.dir===-1?(4-p)%4:p];
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const my=A.hand.map(t=>IDX[idOf(t)]).filter(x=>!st.playedIds.has(idOf(ALL[x]))&&x!==ti);
  const cnt=[0,0,0,0,0,0,0];for(const u of my){cnt[TA[u]]++;if(TB[u]!==TA[u])cnt[TB[u]]++;}
  const nl=rec.l,nr=rec.r,ends=nl===nr?[nl]:[nl,nr];
  const lead=!st.board;
  const covered=lead?-1:(rec.e==='L'?st.board.l:st.board.r);
  const has=(x,v)=>TA[x]===v||TB[x]===v;
  const outside=v=>7-st.playedCnt[v]-(has(ti,v)?1:0)-cnt[v];
  const evid=(p,v)=>{const L=st.lead[p];if(L>=0&&has(L,v))return 'salió con '+TA[L]+'-'+TB[L];const n=st.puts[p][v];return n>=2?'ha puesto el '+v+' '+n+' veces':n===1?'puso el '+v:'';};
  const pct=x=>Math.round(x*100)+'%';
  let r1,r2;
  if(!my.length){r1='¡Dominó! Cierras la mano';}
  else if(nl===nr&&outside(nl)===0&&cnt[nl]===0){r1='Trancas: ustedes ganan en '+pct(rec.win)+' de los repartos posibles';}
  else if(lead){let X=a;if(cnt[b]>cnt[a])X=b;const k=cnt[X]+1;
    r1=k>=2?'Sales con tu número fuerte: tienes '+k+' fichas de '+X:(a===b?'Sales con un doble y te lo quitas de encima temprano':'Es la salida que más puntos deja en las simulaciones');}
  else{
    const C=[];
    if(ends.every(v=>(st.nh[1]>>v)&1))C.push({s:9,t:'Haces pasar a '+nm(1)+': no tiene '+ends.join(' ni ')});
    for(const v of ends){const d=E[2][v]-E[1][v];if(!((st.nh[2]>>v)&1)&&E[2][v]>=1.2&&d>=0.3){const x=evid(2,v);C.push({s:2+d+(x?1.5:0),t:'Le dejas el '+v+' a tu compañero ('+(x||'tiene ~'+Math.round(E[2][v])+' de '+v)+')'});}}
    if(covered>=0&&!ends.includes(covered))for(const rp of [1,3]){const x=evid(rp,covered);if((x||E[rp][covered]>=1.5)&&E[rp][covered]>=E[2][covered])C.push({s:2+E[rp][covered]+(x?1.5:0),t:'Le tapas el '+covered+' a '+nm(rp)+(x?' ('+x+')':'')});}
    let pn=0;for(let n=0;n<an.S.length;n++){const h1=an.S[n][1];if(!h1.some(u=>ends.some(v=>has(u,v))))pn+=an.W[n];}
    if(pn>=0.55)C.push({s:1.5+pn,t:cap(nm(1))+' probablemente no tiene '+ends.join(' ni ')+' ('+pct(pn)+')'});
    for(const v of ends){const x=evid(2,v);if(x&&!((st.nh[2]>>v)&1))C.push({s:1.2,t:'Mantienes vivo el '+v+' de tu compañero ('+x+')'});}
    if(a===b)C.push({s:0.5,t:'No cambias la mesa: sigue '+nl+'–'+nr+' y no abres número nuevo'});
    C.sort((x,y)=>y.s-x.s);
    r1=C.length?C[0].t:'Es la que más puntos deja en las simulaciones';
  }
  if(!my.length){r2='Se anotan ~'+Math.round(Math.abs(rec.ev))+' puntos';}
  else if(lead){let X=a;if(cnt[b]>cnt[a])X=b;
    if(cnt[X]+1>=2)r2='Le avisas a tu compañero que tu número es el '+X;
    else{const k=[0,1,2,3,4,5,6].filter(v=>cnt[v]>0).length;r2='Te quedan fichas de '+k+' números: no te quedas sin salida';}}
  else if(a===b){const o=outside(a);r2='Sueltas el doble de '+a+(o<=2?': '+(o===1?'queda 1':'quedan '+o)+' de '+a+' afuera y te lo podían ahorcar':' a tiempo, antes de que se cierre el '+a);}
  else{let bv=-1,bc=0;for(const v of ends)if(cnt[v]>bc){bc=cnt[v];bv=v;}
    if(bc>=2)r2='Te quedan '+bc+' fichas de '+bv+': vuelves a jugar por ahí';
    else if(TP[ti]>=9)r2='Sueltas una pesada ('+TP[ti]+' puntos) por si pierden la mano';
    else{const k=[0,1,2,3,4,5,6].filter(v=>cnt[v]>0).length;r2='Te quedan fichas de '+k+' números: no te quedas sin salida';}}
  return [r1,r2];
}

// Probabilidad de ganar el tranque (para la pantalla final)
function tranqueOdds(A,an){
  const st=an.st;const my=A.hand.map(t=>IDX[idOf(t)]).filter(x=>!st.playedIds.has(idOf(ALL[x])));
  let win=0,tie=0;const mp=pips(my);
  for(let n=0;n<an.S.length;n++){const s=an.S[n];const t0=mp+pips(s[2]),t1=pips(s[1])+pips(s[3]);if(t0<t1)win+=an.W[n];else if(t0===t1)tie+=an.W[n];}
  return {win,tie};
}

    const recs=(myTurn&&an.ok)?getRecs(an):[];
    const canPass=!!st.board&&(!myTurn||recs.length===0);
    h+='<div class="turn2"><div class="tt">'+(myTurn?'Te toca':'Tira: '+LONG[st.turn])+'</div><div class="tb">'+
      '<button class="'+((myTurn&&!recs.length&&st.board)?'hot':'')+'" data-act="pass" '+(canPass?'':'disabled')+'>PASS</button>'+
      '<button data-act="undo" '+(canUndo()?'':'disabled')+'>Deshacer</button></div></div>';
    if(myTurn){
      if(recs.length){
        const b=recs[0];
        h+='<button class="rec best" data-act="myplay" data-t="'+idOf(b.t)+'" data-e="'+b.e+'">'+tileHtml(b.t,'bigt')+
           '<span class="ri"><b>★ '+endText(b)+'</b><small><em>Mesa:</em> '+esc(b.why[0])+'</small><small><em>Tus fichas:</em> '+esc(b.why[1])+'</small></span></button>';
        if(recs.length>1){
          h+='<div class="sec dim">Otras opciones</div><div class="alts">'+recs.slice(1).map(r=>
            '<button class="alt" data-act="myplay" data-t="'+idOf(r.t)+'" data-e="'+r.e+'">'+tileHtml(r.t)+'<small>'+sideShort(r)+' · '+(r.ev-b.ev).toFixed(1)+'</small></button>').join('')+'</div>';
        }
      }else if(an.ok){h+='<div class="note" style="margin-top:12px">No tienes ficha para jugar. Pasa.</div>';}
      if(an.ok){
        h+=secPct('Fichas que no has visto');
        if(pctOn)h+=pctLegend+'<div class="grid">'+pool.map(t=>pcell(t,an,0,false,true)).join('')+'</div>';
      }
    }else if(an.ok){
      const legal=pool.filter(t=>legalOptions(t,st.board).length);
      h+=secPct('¿Qué tiró '+LONG[st.turn]+'? Toca la ficha');
      if(pctOn)h+=pctLegend;
      if(!legal.length)h+='<div class="note">No queda ficha jugable fuera de tu mano: le toca pasar.</div>';
      else h+='<div class="grid">'+legal.map(t=>pcell(t,an,st.turn,true,pctOn)).join('')+'</div>';
      if(pctOn){
        const rest=pool.filter(t=>!legalOptions(t,st.board).length);
        if(rest.length)h+='<div class="sec dim">No pueden jugar ahora</div><div class="grid">'+rest.map(t=>pcell(t,an,st.turn,false,true)).join('')+'</div>';
      }
    }
  }
  h+='<div class="sec">Mis fichas ('+myRem.length+')</div><div class="chips">'+myRem.map(t=>tileHtml(t)).join('')+'</div>';
  const rem=[0,1,2,3,4,5,6].map(n=>pool.filter(t=>t[0]===n||t[1]===n).length);
  h+='<div class="sec">Fichas ajenas por salir, por número</div><div class="nums">'+rem.map((c,n)=>'<span>'+face(n,'nf')+c+'</span>').join('')+'</div>';
  h+='<button class="ghost" data-act="resethand">Reiniciar mano</button>';
  return h;
}

function renderAssist(){
  const b=$('#aBody');
  b.innerHTML=A.phase==='hand'?viewHand():A.phase==='setup'?viewSetup():viewPlay();
}

/* ---------- asistente: acciones ---------- */
function askEnd(tile,st,cb){
  modal({title:'¿Por dónde jugó?',text:tileHtml(tile),sticky:false,buttons:[
    {label:'Izquierda ('+st.board.l+')',fn:()=>cb('L')},
    {label:'Derecha ('+st.board.r+')',cls:'pri',fn:()=>cb('R')}]});
}
function act(a,d){
  switch(a){
    case 'pick':{
      const i=A.hand.findIndex(t=>idOf(t)===d.t);
      if(i>=0)A.hand.splice(i,1);else if(A.hand.length<7)A.hand.push(byId[d.t]);
      A.hand.sort((x,y)=>x[0]-y[0]||x[1]-y[1]);
      break;}
    case 'handok':
      if(A.hand.length!==7)return;
      A.phase='setup';
      if(A.first)A.starter=hasSix()?0:null;
      break;
    case 'first':
      A.first=d.v==='1';A.starter=null;
      if(A.first&&hasSix())A.starter=0;
      break;
    case 'starter':A.starter=+d.s;break;
    case 'dir':A.dir=+d.v;break;
    case 'backhand':A.phase='hand';break;
    case 'start':
      if(A.starter==null)return;
      A.events=[];A.winner=null;A.showPct=false;
      if(A.first)A.events.push({k:'p',s:A.starter,t:[6,6],e:'F'});
      A.phase='play';
      break;
    case 'myplay':
      A.events.push({k:'p',s:0,t:byId[d.t],e:d.e});
      break;
    case 'oplay':{
      const st=derive(A);
      const t=byId[d.t],opts=legalOptions(t,st.board);
      if(!opts.length)return;
      const s=st.turn;
      if(opts.length===1){A.events.push({k:'p',s,t,e:opts[0].e});}
      else{askEnd(t,st,e=>{A.events.push({k:'p',s,t,e});saveA();renderAssist();});return;}
      break;}
    case 'pass':{
      const st=derive(A);
      if(!st.board)return;
      A.events.push({k:'x',s:st.turn});
      break;}
    case 'undo':if(canUndo())A.events.pop();A.winner=null;break;
    case 'win':A.winner=d.s==='tie'?'tie':+d.s;break;
    case 'pct':A.showPct=!A.showPct;break;
    case 'nexthand':{
      const st=derive(A);
      let w=st.over&&st.over.type==='domino'?st.over.seat:A.winner;
      if(w==null)return;
      if(w==='tie')w=A.lastWinner!=null?A.lastWinner:A.starter;else A.lastWinner=w;
      A.phase='hand';A.hand=[];A.events=[];A.first=false;A.starter=w;A.winner=null;A.showPct=false;
      break;}
    case 'resethand':
      modal({title:'¿Reiniciar la mano?',text:'Se borran tus fichas y lo anotado de esta mano. El marcador no se toca.',buttons:[{label:'Cancelar'},{label:'Reiniciar',cls:'pri',fn:()=>{
        A.phase='hand';A.hand=[];A.events=[];A.winner=null;A.showPct=false;if(A.first)A.starter=null;saveA();renderAssist();window.scrollTo(0,0);
      }}]});
      return;
  }
  saveA();renderAssist();
  if(a==='handok'||a==='start'||a==='nexthand'||a==='backhand')window.scrollTo(0,0);
}
$('#aBody').addEventListener('click',e=>{
  if(Date.now()<lockUntil)return;
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  act(el.dataset.act,el.dataset);
});

/* ---------- arranque ---------- */
renderCounter();
wake();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
})();
</script>
